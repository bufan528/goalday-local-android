<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Compare Fixed</title>
<style>
body { margin:0; background:#222; color:#eee; font-family:sans-serif; }
.flex { display:flex; flex-wrap:wrap; gap:10px; padding:10px; }
.card { background:#333; padding:8px; border-radius:6px; }
h3 { margin:4px 0; }
img { max-width:500px; max-height:900px; display:block; border:1px solid #555; }
</style>
</head>
<body>
<div class="flex">
  <div class="card">
    <h3>Fixed (myapp_fixed.png)</h3>
    <img src="myapp_fixed.png">
  </div>
  <div class="card">
    <h3>Before (myapp_now.png)</h3>
    <img src="myapp_now.png">
  </div>
</div>
</body>
</html>
